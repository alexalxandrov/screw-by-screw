name: OptiPlex 5060 package validation
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/models/dell-optiplex-5060-tower-family/**"
      - "content/catalog/models.json"
      - "public/models/dell_optiplex_5060_tower_v04.sbsmodel"
      - "tools/modeling/**"
      - "tools/content/validate_glb_bindings.py"
      - "src/data/catalog.js"
      - "src/viewer/ModelPackageLoader.js"
      - "tests/**"
      - ".github/workflows/optiplex-package-validation.yml"
  pull_request:
    paths:
      - "content/models/dell-optiplex-5060-tower-family/**"
      - "content/catalog/models.json"
      - "public/models/dell_optiplex_5060_tower_v01.sbsmodel"
      - "public/models/dell_optiplex_5060_tower_v04.sbsmodel"
      - "tools/modeling/build_device_blockout.py"
      - "tools/modeling/package_model.py"
      - "tools/modeling/build_text_model_package.py"
      - "tools/content/validate_glb_bindings.py"
      - "src/viewer/ModelPackageLoader.js"
      - "tests/optiplex-package.test.js"
      - "tests/test_text_model_package.py"
      - "tests/test_device_blockout.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/optiplex-package-validation.yml"

jobs:
  validate-optiplex:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked viewer dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate the OptiPlex GLB from the content inventory
        run: |
          python tools/modeling/build_device_blockout.py \
            --components content/models/dell-optiplex-5060-tower-family/components.json \
            --output /tmp/optiplex-5060-family.glb
      - name: Test procedural device geometry generator
        run: python -m unittest discover -s tests -p "test_device_blockout.py"
      - name: Validate semantic component-to-GLB bindings
        run: |
          python tools/content/validate_glb_bindings.py \
            --components content/models/dell-optiplex-5060-tower-family/components.json \
            --glb /tmp/optiplex-5060-family.glb
      - name: Build and validate a fresh portable package
        run: |
          python tools/modeling/package_model.py \
            --model-dir content/models/dell-optiplex-5060-tower-family \
            --scene /tmp/optiplex-5060-family.glb \
            --output /tmp/optiplex-5060-family.sbsmodel
      - name: Rebuild the published v0.4 package from current sidecars and generated GLB
        run: |
          python tools/modeling/build_text_model_package.py \
            --model-dir content/models/dell-optiplex-5060-tower-family \
            --scene /tmp/optiplex-5060-family.glb \
            --output public/models/dell_optiplex_5060_tower_v04.sbsmodel
      - name: Verify regenerated package using the production loader
        run: node --test tests/optiplex-package.test.js tests/model-startup.test.js
      - name: Test deterministic package builder
        run: python -m unittest discover -s tests -p "test_text_model_package.py"
      - name: Run unit suite
        run: npm run test:unit
      - name: Build web and offline standalone viewers
        run: npm run build
      - name: Verify published packages are embedded and the RTX archive is excluded
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const html = await readFile("index.html", "utf8");
          const catalog = JSON.parse(await readFile("content/catalog/models.json", "utf8"));
          const marker = "globalThis.SBS_CATALOG_PACKAGE_DATA_URLS = ";
          const start = html.indexOf(marker);
          if (start < 0) throw new Error("Standalone launcher has no embedded package map");
          const jsonStart = start + marker.length;
          const jsonEnd = html.indexOf("</script>", jsonStart);
          if (jsonEnd < 0) throw new Error("Embedded catalogue package map is not closed");
          const packages = JSON.parse(html.slice(jsonStart, jsonEnd).trim().replace(/;$/, ""));
          const defaults = catalog.models.filter((model) => model.default_package === true);
          const dell = catalog.models.find((model) => model.id === "pc.dell.optiplex-5060-tower.family" && model.published === true);
          const archived = catalog.models.filter((model) => model.published === false);
          if (defaults.length !== 1 || defaults[0].id !== "computer.ibm.5150.1981") {
            throw new Error("IBM PC 5150 must remain the sole default reference");
          }
          if (!dell || !packages[dell.id]) throw new Error("Published Dell OptiPlex family package missing from standalone launcher");
          for (const model of archived) {
            if (packages[model.id]) throw new Error("Unpublished archive embedded in standalone launcher: " + model.id);
          }
          console.log(JSON.stringify({
            default: defaults[0].id,
            embedded: [dell.id],
            excluded: archived.map((model) => model.id)
          }, null, 2));
          NODE
      - name: Install Chromium and test category search and Dell package loading
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium e2e/catalog.spec.js

      - name: Commit regenerated OptiPlex v0.4 package
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/dell_optiplex_5060_tower_v04.sbsmodel
          if git diff --cached --quiet; then
            echo "Published OptiPlex v0.4 package is already current"
          else
            git commit -m "build: publish OptiPlex 5060 procedural geometry v0.4"
            # npm run build regenerates the tracked standalone launcher; this workflow
            # publishes only the model package, so discard that unrelated build output
            # before rebasing the generated package commit onto a concurrently updated branch.
            git restore --worktree index.html
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

