name: Blender blockout generation
permissions:
  contents: write
concurrency:
  group: blender-model-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/modeling/build_rtx3060_xc_black_blockout.py"
      - "tools/modeling/build_ibm_pc_5150_blockout.py.gz"
      - "tools/modeling/inspect_blend_scene.py"
      - "tools/modeling/validate_blockout_package.py"
      - "tools/modeling/package_model.py"
      - "src/viewer/ModelPackageLoader.js"
      - "tools/content/**"
      - "content/**"
      - "tests/**"
      - "MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/**"
      - "MODELS/COMPUTERS/IBM/5150/**"
      - "src/**"
      - "index.html"
      - "index.template.html"
      - "tools/build_standalone_html.mjs"
      - "package.json"
      - "playwright.config.js"
      - "e2e/**"
      - ".github/workflows/blender-model-validation.yml"
  push:
    branches:
      - main
    paths:
      - "tools/modeling/build_rtx3060_xc_black_blockout.py"
      - "tools/modeling/build_ibm_pc_5150_blockout.py.gz"
      - "tools/modeling/inspect_blend_scene.py"
      - "tools/modeling/validate_blockout_package.py"
      - "tools/modeling/package_model.py"
      - "src/viewer/ModelPackageLoader.js"
      - "tools/content/**"
      - "content/**"
      - "tests/**"
      - "MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/**"
      - "MODELS/COMPUTERS/IBM/5150/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "playwright.config.js"
      - "e2e/**"
      - ".github/workflows/blender-model-validation.yml"
jobs:
  build-and-inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6 libgl1 libegl1 libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxcomposite1 libxdamage1
      - name: Download and verify Blender 4.3.2
        run: |
          set -euo pipefail
          archive="blender-4.3.2-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.3"
          curl -fL "$base/$archive" -o "$archive"
          curl -fL "$base/blender-4.3.2.sha256" -o blender-4.3.2.sha256
          expected=$(grep -F "$archive" blender-4.3.2.sha256 | awk '{print $1}' | head -n 1)
          test ${#expected} -eq 64
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check -
          tar -xf "$archive"
      - name: Generate v0.5 Blender scene and GLB
        run: |
          set -euo pipefail
          ./blender-4.3.2-linux-x64/blender --version
          ./blender-4.3.2-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tools/modeling/build_rtx3060_xc_black_blockout.py
      - name: Inspect generated scene
        run: |
          ./blender-4.3.2-linux-x64/blender MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.blend --background --python-exit-code 1 --python tools/modeling/inspect_blend_scene.py -- --output artifacts/rtx3060_v05_inspection.txt --json-output artifacts/rtx3060_v05_inspection.json
          cat artifacts/rtx3060_v05_inspection.txt
      - name: Validate generated GLB and manifest
        run: |
          python tools/modeling/validate_blockout_package.py \
            --manifest MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.manifest.json \
            --glb MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.glb
          python tools/content/validate_glb_bindings.py \
            --components content/models/evga-rtx3060-xc-black-12gb/components.json \
            --glb MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.glb
      - name: Build verified content release manifest
        run: python tools/content/build_release_manifest.py content/models/evga-rtx3060-xc-black-12gb
      - name: Build portable SBS model package
        run: |
          mkdir -p artifacts
          python tools/modeling/package_model.py \
            --model-dir content/models/evga-rtx3060-xc-black-12gb \
            --scene MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.glb \
            --output artifacts/rtx3060_xc_black_v05.sbsmodel
      - name: Restore compressed IBM PC 5150 source files
        run: |
          gzip -dk tools/modeling/build_ibm_pc_5150_blockout.py.gz
          gzip -dk tests/test_ibm_pc_5150_content.py.gz
          for sidecar in model components relationships sources process_layers assembly_steps learning claims animations; do
            gzip -dk "content/models/ibm-pc-5150-1981/${sidecar}.json.gz"
          done
      - name: Generate IBM PC 5150 Blender scene and GLB
        run: |
          ./blender-4.3.2-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tools/modeling/build_ibm_pc_5150_blockout.py
      - name: Validate IBM PC 5150 content and scene bindings
        run: |
          python tools/content/build_release_manifest.py content/models/ibm-pc-5150-1981
          python tools/content/validate_model_package.py content/models/ibm-pc-5150-1981
          python tools/content/validate_glb_bindings.py \
            --components content/models/ibm-pc-5150-1981/components.json \
            --glb MODELS/COMPUTERS/IBM/5150/04-WORKING/generated/ibm_pc_5150_1981.glb
          python -m unittest discover -s tests -p 'test_ibm_pc_5150_content.py'
      - name: Build IBM PC 5150 portable SBS model package
        run: |
          python tools/modeling/package_model.py \
            --model-dir content/models/ibm-pc-5150-1981 \
            --scene MODELS/COMPUTERS/IBM/5150/04-WORKING/generated/ibm_pc_5150_1981.glb \
            --output artifacts/ibm_pc_5150_1981.sbsmodel
      - name: Stage generated GLB for viewer
        run: |
          mkdir -p public/models
          cp MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.glb public/models/
          cp artifacts/rtx3060_xc_black_v05.sbsmodel public/models/
          cp MODELS/COMPUTERS/IBM/5150/04-WORKING/generated/ibm_pc_5150_1981.glb public/models/
          cp artifacts/ibm_pc_5150_1981.sbsmodel public/models/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked viewer dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify portable package with browser loader
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { loadModelPackage } from "./src/viewer/ModelPackageLoader.js";
          const bytes = await readFile("artifacts/rtx3060_xc_black_v05.sbsmodel");
          const buffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const pkg = await loadModelPackage({ name: "rtx3060_xc_black_v05.sbsmodel", size: bytes.byteLength, arrayBuffer: async () => buffer });
          console.log(JSON.stringify({ modelId: pkg.report.modelId, components: pkg.report.componentCount, relationships: pkg.report.relationshipCount, integrityVerified: pkg.integrityVerified }, null, 2));
          NODE
      - name: Verify IBM PC 5150 portable package with browser loader
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { loadModelPackage } from "./src/viewer/ModelPackageLoader.js";
          const bytes = await readFile("artifacts/ibm_pc_5150_1981.sbsmodel");
          const buffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const pkg = await loadModelPackage({ name: "ibm_pc_5150_1981.sbsmodel", size: bytes.byteLength, arrayBuffer: async () => buffer });
          const expected = { modelId: "computer.ibm.5150.1981", components: 71, relationships: 100 };
          if (pkg.report.modelId !== expected.modelId || pkg.report.componentCount !== expected.components ||
              pkg.report.relationshipCount !== expected.relationships || !pkg.integrityVerified) {
            throw new Error("IBM PC 5150 portable package verification failed: " + JSON.stringify(pkg.report));
          }
          console.log(JSON.stringify({ ...expected, integrityVerified: pkg.integrityVerified }, null, 2));
          NODE
      - name: Verify Dell OptiPlex 5060 family JSON-envelope package with production loader
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { loadModelPackage } from "./src/viewer/ModelPackageLoader.js";
          const bytes = await readFile("public/models/dell_optiplex_5060_tower_v03.sbsmodel");
          const buffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const pkg = await loadModelPackage({ name: "dell_optiplex_5060_tower_v03.sbsmodel", size: bytes.byteLength, arrayBuffer: async () => buffer });
          const expected = { modelId: "pc.dell.optiplex-5060-tower.family", components: 137, relationships: 145 };
          if (pkg.report.modelId !== expected.modelId || pkg.report.componentCount !== expected.components ||
              pkg.report.relationshipCount !== expected.relationships || !pkg.integrityVerified) {
            throw new Error("Dell OptiPlex family package verification failed: " + JSON.stringify(pkg.report));
          }
          console.log(JSON.stringify({ ...expected, integrityVerified: pkg.integrityVerified }, null, 2));
          NODE
      - name: Install Chromium for GLB integration test
        run: npx playwright install --with-deps chromium
      - name: Build viewer with generated GLB
        run: npm run build
      - name: Verify standalone HTML embeds the default model package
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const html = await readFile("index.html", "utf8");
          const catalog = JSON.parse(await readFile("content/catalog/models.json", "utf8"));
          const marker = "globalThis.SBS_CATALOG_PACKAGE_DATA_URLS = ";
          const markerIndex = html.indexOf(marker);
          if (markerIndex < 0) throw new Error("Standalone launcher has no embedded catalogue package map");
          const jsonStart = markerIndex + marker.length;
          const jsonEnd = html.indexOf("</script>", jsonStart);
          if (jsonEnd < 0) throw new Error("Embedded catalogue package map is not closed");
          const rawMap = html.slice(jsonStart, jsonEnd).trim().replace(/;$/, "");
          const packages = JSON.parse(rawMap);
          const required = catalog.models.filter((model) => model.published === true);
          const archived = catalog.models.filter((model) => model.published === false);
          const defaults = required.filter((model) => model.default_package === true);
          if (defaults.length !== 1 || defaults[0].id !== "computer.ibm.5150.1981") {
            throw new Error("IBM PC 5150 must remain the sole default published reference");
          }
          for (const model of archived) {
            if (packages[model.id]) throw new Error("Standalone launcher must not embed unpublished research archive: " + model.id);
          }
          if (!required.some((model) => model.id === "computer.ibm.5150.1981")) throw new Error("Catalogue is missing the IBM PC 5150 reference model");
          if (!required.some((model) => model.id === "pc.dell.optiplex-5060-tower.family")) throw new Error("Catalogue is missing the published Dell OptiPlex family reference");
          for (const model of required) {
            const dataUrl = packages[model.id];
            if (typeof dataUrl !== "string" || !dataUrl.startsWith("data:application/octet-stream;base64,")) {
              throw new Error("Standalone launcher is missing the default package for " + model.id);
            }
          }
          console.log(JSON.stringify({
            requiredPackagesEmbedded: required.map((model) => model.id),
            archivedPackagesExcluded: archived.map((model) => model.id),
            packageCount: Object.keys(packages).length,
            selfContained: true
          }, null, 2));
          NODE
      - name: Test generated GLB inside the viewer
        run: npm run test:e2e:model
      - name: Test real .sbsmodel import in browser
        run: npm run test:e2e:generated-package
      - name: Commit the generated published IBM PC 5150 package
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/ibm_pc_5150_1981.sbsmodel
          if git diff --cached --quiet; then
            echo "Published IBM package is already current"
          else
            git commit -m "build: publish IBM PC 5150 model package"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      - name: Restore the source fallback scene while retaining both published packages
        run: |
          mkdir -p public/models
          find public/models -maxdepth 1 -type f \
            ! -name "dell_optiplex_5060_tower_v03.sbsmodel" \
            ! -name "ibm_pc_5150_1981.sbsmodel" -delete
      - name: Run full viewer and accessibility suite against the source fallback scene
        run: npm run test:e2e:chromium
      - name: Collect generated artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.blend artifacts/ 2>/dev/null || true
          cp MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.glb artifacts/ 2>/dev/null || true
          cp MODELS/GPUS/EVGA/RTX-3060-XC-BLACK-12GB/04-WORKING/generated/rtx3060_xc_black_blockout_v05.manifest.json artifacts/ 2>/dev/null || true
          cp artifacts/rtx3060_xc_black_v05.sbsmodel artifacts/ 2>/dev/null || true
          cp MODELS/COMPUTERS/IBM/5150/04-WORKING/generated/ibm_pc_5150_1981_blockout.blend artifacts/ 2>/dev/null || true
          cp MODELS/COMPUTERS/IBM/5150/04-WORKING/generated/ibm_pc_5150_1981.glb artifacts/ 2>/dev/null || true
          cp MODELS/COMPUTERS/IBM/5150/04-WORKING/generated/ibm_pc_5150_1981.manifest.json artifacts/ 2>/dev/null || true
          cp artifacts/ibm_pc_5150_1981.sbsmodel artifacts/ 2>/dev/null || true
          cp public/models/dell_optiplex_5060_tower_v03.sbsmodel artifacts/ 2>/dev/null || true
          cp tools/modeling/build_ibm_pc_5150_blockout.py artifacts/ibm_pc_5150_blockout_source.py 2>/dev/null || true
          cp tools/modeling/build_ibm_pc_5150_blockout.py.gz artifacts/ibm_pc_5150_blockout_source.py.gz 2>/dev/null || true
          cp content/models/ibm-pc-5150-1981/components.json artifacts/ibm_pc_5150_components_source.json 2>/dev/null || true
          cp content/models/ibm-pc-5150-1981/components.json.gz artifacts/ibm_pc_5150_components_source.json.gz 2>/dev/null || true
          cp tests/test_ibm_pc_5150_content.py artifacts/ibm_pc_5150_content_tests.py 2>/dev/null || true
          cp content/models/ibm-pc-5150-1981/assembly_steps.json artifacts/ibm_pc_5150_assembly_steps.json 2>/dev/null || true
          cp content/models/ibm-pc-5150-1981/animations.json artifacts/ibm_pc_5150_animations.json 2>/dev/null || true
          cp content/models/ibm-pc-5150-1981/sources.json artifacts/ibm_pc_5150_sources.json 2>/dev/null || true
          cp docs/IBM_PC_5150_DISASSEMBLY_SEQUENCE.md artifacts/ 2>/dev/null || true
          cp docs/IBM_PC_5150_FASTENER_EVIDENCE.md artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtx3060-ibm-5150-optiplex-5060-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
