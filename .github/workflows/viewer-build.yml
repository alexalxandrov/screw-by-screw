name: Viewer build
permissions:
  contents: read
concurrency:
  group: viewer-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "content/**"
      - "e2e/**"
      - "index.html"
      - "index.template.html"
      - "tools/build_standalone_html.mjs"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "vite.config.js"
      - ".github/workflows/viewer-build.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/viewer-scene-controller.test.js"
      - "content/**"
      - "e2e/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "vite.config.js"
      - ".github/workflows/viewer-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run viewer engine unit tests
        run: npm run test:unit
      - name: Install Chromium and Firefox for browser tests
        run: npx playwright install --with-deps chromium firefox
      - name: Build production viewer
        run: npm run build
      - name: Browser tests run with the generated default model
        run: echo "The full Playwright suite runs in blender-model-validation.yml after the default GPU package is generated and staged."
