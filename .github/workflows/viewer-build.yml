name: Viewer build
permissions:
  contents: write
concurrency:
  group: viewer-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "content/**"
      - "e2e/**"
      - "public/models/**"
      - "index.html"
      - "index.template.html"
      - "tools/build_standalone_html.mjs"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "vite.config.js"
      - ".github/workflows/viewer-build.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/viewer-scene-controller.test.js"
      - "content/**"
      - "e2e/**"
      - "public/models/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "vite.config.js"
      - ".github/workflows/viewer-build.yml"

jobs:
  check_published_packages:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check every published catalogue package is present
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          catalog = json.loads(Path("content/catalog/models.json").read_text(encoding="utf-8"))
          missing = []
          for model in catalog.get("models", []):
              if model.get("published") is not True:
                  continue
              package_path = model.get("package_path", "")
              package = Path("public") / package_path
              if not package.is_file() or package.stat().st_size <= 0:
                  missing.append(f"{model.get('id')}: {package}")
          print("ready=" + ("false" if missing else "true"))
          for item in missing:
              print(f"::notice::{item}")
          PY
  build:
    needs: check_published_packages
    if: needs.check_published_packages.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run viewer engine unit tests
        run: npm run test:unit
      - name: Install Chromium and Firefox for browser tests
        run: npx playwright install --with-deps chromium firefox
      - name: Build web and standalone viewers
        run: npm run build
      - name: Verify CSP-compatible web artifact and offline standalone
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const web = await readFile("dist/index.html", "utf8");
          const standalone = await readFile("index.html", "utf8");
          if (!web.includes("src=\"")) throw new Error("Web build has no external JavaScript entry");
          if (!web.includes("href=\"")) throw new Error("Web build has no external stylesheet");
          if (standalone.includes("<script src=\"")) throw new Error("Standalone launcher still references external scripts");
          if (standalone.includes("<link rel=\"stylesheet\"")) throw new Error("Standalone launcher still references external CSS");
          if (!standalone.includes("Screw by Screw failed to start")) throw new Error("Standalone launcher is missing startup recovery");
          const marker = "data:text/javascript;base64,";
          const start = standalone.indexOf(marker);
          const end = standalone.indexOf("\"", start + marker.length);
          if (start < 0 || end < 0) throw new Error("Standalone launcher has no embedded application bundle");
          const bundle = Buffer.from(standalone.slice(start + marker.length, end), "base64").toString("utf8");
          if (!bundle.includes("procedureActionType")) throw new Error("Standalone launcher does not contain the current disassembly runtime");
          if (bundle.includes("simulation-speed")) throw new Error("Standalone launcher contains the removed simulation-speed control");
          console.log("Web CSP artifact and current offline standalone launcher verified.");
          NODE
      - name: Run browser interaction tests
        run: npm run test:e2e
      - name: Commit regenerated standalone launcher
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Standalone launcher is already current"
          else
            git commit -m "build: refresh standalone offline launcher"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
