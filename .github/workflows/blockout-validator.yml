name: Model package validation
concurrency:
  group: model-package-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "tools/modeling/**"
      - "tools/content/**"
      - "content/**"
      - "tests/test_blockout_validator.py"
      - "tests/test_content_package.py"
      - ".github/workflows/blockout-validator.yml"
  pull_request:
    paths:
      - "tools/modeling/**"
      - "tools/content/**"
      - "content/**"
      - "tests/test_blockout_validator.py"
      - "tests/test_content_package.py"
      - ".github/workflows/blockout-validator.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validation tools
        run: python -m py_compile tools/modeling/validate_blockout_package.py tools/modeling/inspect_blend_scene.py tools/content/validate_model_package.py tools/content/build_release_manifest.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build content release manifest
        run: python tools/content/build_release_manifest.py content/models/evga-rtx3060-xc-black-12gb
      - name: Validate RTX 3060 content package
        run: python tools/content/validate_model_package.py content/models/evga-rtx3060-xc-black-12gb
